# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Pre-commit configuration structured by 5 pipeline stages:
# Stage 1 — Fast Fail          (Cheap, non-mutating checks & security scan)
# Stage 2 — Generate           (Codegen & derived file generation)
# Stage 3 — Semantic Auto Fix  (Linter autofix, formatting, doc autofix)
# Stage 4 — Text Finalization  (Line endings, trailing whitespace, EOF newline)
# Stage 5 — Deep Validation    (Type checking & deep analysis)

repos:
  # =========================================================================
  # Stage 1 — Fast Fail
  # =========================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: debug-statements

  # =========================================================================
  # Stage 2 — Generate
  # =========================================================================
  - repo: local
    hooks:
      - id: generate-env-example
        name: Generate .env.example
        entry: uv run python scripts/generate_env_example.py
        language: system
        pass_filenames: false
        files: ^(backend/config/settings\.py|scripts/generate_env_example\.py|\.env\.example)$

  # =========================================================================
  # Stage 3 — Semantic Auto Fix
  # =========================================================================
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter, markdown]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args:
          - --fix

  # =========================================================================
  # Stage 4 — Text Finalization
  # =========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  # =========================================================================
  # Stage 5 — Deep Validation
  # =========================================================================
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy backend
        language: system
        pass_filenames: false
        files: ^(backend/|pyproject\.toml)
